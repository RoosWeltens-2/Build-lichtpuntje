<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101510" />
    <title>Three.js Taxi</title>
  </head>
  <body>
    <main>
      <div class="label">THREE.JS <span>01</span></div>
